name: Devin on "devin" label

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: devin-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-devin-session:
    if: ${{ github.event.label.name == 'devin' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build prompt
        env:
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf 'Triage and resolve this GitHub issue: %s\n\n' "$ISSUE_URL"
            printf 'Repository: %s\n' "$REPO"
            printf 'Title: %s\n\n' "$ISSUE_TITLE"
            printf 'Body:\n%s\n\n' "$ISSUE_BODY"
            printf 'REQUIREMENTS:\n'
            printf -- '- Investigate the issue first and report your plan before making changes.\n'
            printf -- '- When you open a PR, include this exact line in the description: Fixes %s#%s\n' "$REPO" "$ISSUE_NUMBER"
            printf -- '- Include "Refs %s#%s" in every commit message of that PR.\n' "$REPO" "$ISSUE_NUMBER"
            printf -- '- Once the PR is open, comment its URL on issue %s so the reporter is notified.\n' "$ISSUE_URL"
          } > prompt.txt

      - name: Create Devin session
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DEVIN_API_KEY:-}" ]; then
            echo "::error::DEVIN_API_KEY repository secret is not set."
            exit 1
          fi

          jq -n \
            --rawfile prompt prompt.txt \
            --arg title "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --arg repo "$REPO" \
            --arg issue "$ISSUE_NUMBER" \
            '{
              prompt: $prompt,
              title: $title,
              idempotent: true,
              tags: ["src:github", "label:devin", "repo:" + $repo, "issue:" + $issue]
            }' > payload.json

          curl -fsS https://api.devin.ai/v1/sessions \
            -H "Authorization: Bearer $DEVIN_API_KEY" \
            -H "Content-Type: application/json" \
            --data @payload.json > response.json

          echo "Devin session: $(jq -r '.url' response.json)" >> "$GITHUB_STEP_SUMMARY"
