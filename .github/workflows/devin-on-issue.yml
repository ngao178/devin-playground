name: Devin on new issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: devin-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-devin-session:
    # Runs on every newly opened issue, and on any issue that later gets the
    # `devin` label. Drop the `opened` clause to require the label.
    if: >-
      github.event.action == 'opened' ||
      github.event.label.name == 'devin'
    runs-on: ubuntu-latest
    steps:
      - name: Build prompt
        env:
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf 'Triage and resolve this GitHub issue: %s\n\n' "$ISSUE_URL"
            printf 'Repository: %s\n' "$REPO"
            printf 'Title: %s\n\n' "$ISSUE_TITLE"
            printf 'Body:\n%s\n\n' "$ISSUE_BODY"
            printf 'REQUIREMENTS:\n'
            printf -- '- Investigate the issue first and report your plan before making changes.\n'
            printf -- '- When you open a PR, include this exact line in the description: Fixes %s#%s\n' "$REPO" "$ISSUE_NUMBER"
            printf -- '- Include "Refs %s#%s" in every commit message of that PR.\n' "$REPO" "$ISSUE_NUMBER"
          } > prompt.txt

      - name: Create Devin session
        id: devin
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DEVIN_API_KEY:-}" ]; then
            echo "::error::DEVIN_API_KEY repository secret is not set."
            exit 1
          fi

          jq -n \
            --rawfile prompt prompt.txt \
            --arg title "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --arg repo "$REPO" \
            --arg issue "$ISSUE_NUMBER" \
            '{
              prompt: $prompt,
              title: $title,
              idempotent: true,
              tags: ["src:github", "repo:" + $repo, "issue:" + $issue]
            }' > payload.json

          curl -fsS https://api.devin.ai/v1/sessions \
            -H "Authorization: Bearer $DEVIN_API_KEY" \
            -H "Content-Type: application/json" \
            --data @payload.json > response.json

          echo "url=$(jq -er '.url' response.json)" >> "$GITHUB_OUTPUT"
          echo "session_id=$(jq -er '.session_id' response.json)" >> "$GITHUB_OUTPUT"
          echo "is_new_session=$(jq -r '.is_new_session // true' response.json)" >> "$GITHUB_OUTPUT"

      - name: Comment session link on the issue
        if: ${{ steps.devin.outputs.url != '' && steps.devin.outputs.is_new_session == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_URL: ${{ steps.devin.outputs.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -n --arg url "$SESSION_URL" \
            '{body: "Devin is picking up this issue.\n\n**Session:** \($url)"}' > comment.json

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @comment.json \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments"
